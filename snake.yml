# Chemin final dans le repo : .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    # Toutes les 12 heures
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer les SVG du serpent
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#D97706&color_dots=#F1F3F7,#D6DCE8,#8C99B4,#3D4E7A,#0F1D3F
            dist/github-snake-dark.svg?color_snake=#F59E0B&color_dots=#161B22,#3D4E7A,#8C99B4,#D97706,#F59E0B

      - name: Pousser sur la branche "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
