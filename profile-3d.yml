# Chemin final dans le repo : .github/workflows/profile-3d.yml
name: GitHub Profile 3D Contrib

on:
  schedule:
    # Tous les jours à 03h00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:   # Permet de lancer manuellement depuis l'onglet Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer les SVG 3D
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        with:
          # Décommente pour inclure les repos privés (nécessite un PAT dans GITHUB_TOKEN)
          # settings: '{"gitHubApiUrl":"https://api.github.com"}'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: mise à jour du profil 3D" || echo "Rien à commit"
          git push
